name: build

# Regenerates registry.json from the plugins' latest releases. Runs on a
# schedule so a plugin release shows up without anyone editing JSON by hand,
# and on demand after tagging one.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sources.json, scripts/**]

permissions:
  contents: write

concurrency:
  group: registry-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the index
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build.py

      - name: Commit if it changed
        run: |
          if git diff --quiet -- registry.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git commit -m "chore: rebuild registry"
          git push
